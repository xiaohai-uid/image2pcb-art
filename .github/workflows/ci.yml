name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Check browser module syntax
        run: npm run check:syntax

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser

  # Publishes the site only after the full verification suite passes, so what
  # is live on Pages is always exactly what was tested on this commit.
  deploy-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The site is the repo root's static files; assemble exactly those so
      # tests, docs, and CI config are never published.
      - name: Assemble site files
        run: |
          mkdir -p _site
          cp index.html app.js pcb-core.mjs image-quantizer.mjs styles.css favicon.svg _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
